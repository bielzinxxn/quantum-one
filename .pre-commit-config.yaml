# Instalar: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  # ruff local: mesma versão fixada no backend/uv.lock
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'cd backend && uv run ruff check . && uv run ruff format --check .'
        language: system
        pass_filenames: false
        files: ^backend/
