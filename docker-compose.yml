# QUANTUM ONE — stack de produção (VPS).
# Segredos: cada serviço recebe SOMENTE as variáveis de que precisa (sem env_file global).
# Redes: `internal` não tem saída para a internet; só marketdata e trader estão em `egress`.

name: quantum-one

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app: &app
  image: quantum-one/backend:${IMAGE_TAG:-dev}
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 30s
  logging: *logging
  networks: [internal]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

x-common-env: &common-env
  QONE_ENV: ${QONE_ENV:-prod}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TRADING_MODE: ${TRADING_MODE:-backtest}
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-quantum_one}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?rode make env}

x-exchange-env: &exchange-env
  BINANCE_TESTNET: ${BINANCE_TESTNET:-false}
  BINANCE_RECV_WINDOW_MS: ${BINANCE_RECV_WINDOW_MS:-5000}
  CLOCK_MAX_OFFSET_MS: ${CLOCK_MAX_OFFSET_MS:-1000}

services:
  postgres:
    image: postgres:16.16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantum_one}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?rode make env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
      PG_MIGRATOR_PASSWORD: ${PG_MIGRATOR_PASSWORD:?}
      PG_MARKETDATA_PASSWORD: ${PG_MARKETDATA_PASSWORD:?}
      PG_ENGINE_PASSWORD: ${PG_ENGINE_PASSWORD:?}
      PG_TRADER_PASSWORD: ${PG_TRADER_PASSWORD:?}
      PG_ACCOUNTING_PASSWORD: ${PG_ACCOUNTING_PASSWORD:?}
      PG_API_PASSWORD: ${PG_API_PASSWORD:?}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
      - -c
      - timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    networks: [internal]

  redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?rode make env}
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    networks: [internal]

  migrate:
    <<: *app
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    command: ["alembic", "upgrade", "head"]
    healthcheck: { disable: true }
    environment:
      <<: *common-env
      SERVICE_NAME: migrate
      POSTGRES_USER: q1_migrator
      POSTGRES_PASSWORD: ${PG_MIGRATOR_PASSWORD:?}

  marketdata:
    <<: *app
    command: ["python", "-m", "quantum_one.services.cli", "marketdata"]
    networks: [internal, egress]
    environment:
      <<: [*common-env, *exchange-env]
      SERVICE_NAME: marketdata
      BINANCE_WS_URL: ${BINANCE_WS_URL:-}
      SCANNER_UNIVERSE_SIZE: ${SCANNER_UNIVERSE_SIZE:-30}
      SCANNER_MIN_QUOTE_VOLUME: ${SCANNER_MIN_QUOTE_VOLUME:-5000000}
      SCANNER_EXTRA_SYMBOLS: ${SCANNER_EXTRA_SYMBOLS:-}
      SCANNER_STALE_AFTER_S: ${SCANNER_STALE_AFTER_S:-10}
      POSTGRES_USER: q1_marketdata
      POSTGRES_PASSWORD: ${PG_MARKETDATA_PASSWORD:?}

  engine:
    <<: *app
    command: ["python", "-m", "quantum_one.services.cli", "engine"]
    environment:
      <<: *common-env
      SERVICE_NAME: engine
      POSTGRES_USER: q1_engine
      POSTGRES_PASSWORD: ${PG_ENGINE_PASSWORD:?}

  trader:
    <<: *app
    command: ["python", "-m", "quantum_one.services.cli", "trader"]
    networks: [internal, egress]
    environment:
      <<: [*common-env, *exchange-env]
      SERVICE_NAME: trader
      POSTGRES_USER: q1_trader
      POSTGRES_PASSWORD: ${PG_TRADER_PASSWORD:?}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      BINANCE_KEY_POLICY: ${BINANCE_KEY_POLICY:-read_only}
      ACCOUNT_POLL_S: ${ACCOUNT_POLL_S:-60}
      # única fonte da chave da Binance em toda a stack
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}

  accounting:
    <<: *app
    command: ["python", "-m", "quantum_one.services.cli", "accounting"]
    environment:
      <<: *common-env
      SERVICE_NAME: accounting
      POSTGRES_USER: q1_accounting
      POSTGRES_PASSWORD: ${PG_ACCOUNTING_PASSWORD:?}

  api:
    <<: *app
    command: ["python", "-m", "quantum_one.api.main"]
    networks: [internal, edge]
    # só loopback da VPS; acesso remoto via Tailscale/túnel SSH (ADR-006)
    ports: ["127.0.0.1:${API_PORT:-8000}:8080"]
    environment:
      <<: *common-env
      SERVICE_NAME: api
      POSTGRES_USER: q1_api
      POSTGRES_PASSWORD: ${PG_API_PASSWORD:?}

networks:
  internal:
    internal: true
  egress: {}
  edge: {}

volumes:
  pgdata: {}
  redisdata: {}
