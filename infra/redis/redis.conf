# Redis do QUANTUM ONE — transporte de eventos (Streams) e estado quente.
# A senha é passada na linha de comando a partir do ambiente (ver docker-compose.yml).

bind 0.0.0.0
protected-mode yes
port 6379

# Persistência: Streams não podem sumir em reinício
appendonly yes
appendfsync everysec
save 900 1 300 100

# Nunca descartar dados em silêncio: com memória cheia, escrita falha e o alerta dispara
maxmemory 512mb
maxmemory-policy noeviction

# Comandos perigosos desabilitados
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command KEYS ""
rename-command SHUTDOWN ""

loglevel notice
