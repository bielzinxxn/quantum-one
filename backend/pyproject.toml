[project]
name = "quantum-one"
version = "0.4.0"
description = "QUANTUM ONE — infraestrutura de trading quantitativo (backend)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "asyncpg>=0.30",
    "redis>=5.2",
    "aiohttp>=3.11",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "ccxt>=4.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "asyncpg-stubs>=0.30",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_one"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exige Postgres e Redis reais (make test-integration)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]  # assert; ×/– em texto pt-BR

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PT018"]  # senhas fictícias; asserts compostos
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["quantum_one"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "ccxt.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["quantum_one"]
branch = true
