# Overrides de desenvolvimento: expõe Postgres e Redis no loopback para testes de integração.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  postgres:
    ports: ["127.0.0.1:${DEV_PG_PORT:-55432}:5432"]
    networks: [internal, devhost]
  redis:
    ports: ["127.0.0.1:${DEV_REDIS_PORT:-56379}:6379"]
    networks: [internal, devhost]

networks:
  devhost: {}
